<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkmate Analytics Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #05070b;
            --panel: rgba(14, 20, 28, 0.92);
            --panel-strong: #0e151f;
            --border: rgba(0, 217, 255, 0.2);
            --text: #f6f9fb;
            --muted: #9fb0c0;
            --accent: #00d9ff;
            --accent-2: #00ff88;
            --accent-3: #ffb800;
            --danger: #ff3b6b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: radial-gradient(circle at 10% 10%, rgba(0, 217, 255, 0.12), transparent 45%),
                        radial-gradient(circle at 80% 0%, rgba(0, 255, 136, 0.1), transparent 40%),
                        #030508;
            color: var(--text);
            min-height: 100vh;
        }
        .shell {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 28px 60px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        .brand {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .brand h1 {
            margin: 0;
            font-size: 1.9rem;
            letter-spacing: 0.5px;
        }
        .brand span {
            font-family: 'JetBrains Mono', monospace;
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 1.4px;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filter-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .filter-card label {
            font-size: 0.72rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .filter-card input,
        .filter-card select {
            background: transparent;
            color: var(--text);
            border: none;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(12, 1fr);
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .kpi {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .kpi h3 {
            margin: 0;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .kpi strong {
            font-size: 1.8rem;
            color: var(--accent);
        }
        .kpi small {
            color: var(--muted);
        }
        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .panel-title h2 {
            margin: 0;
            font-size: 1.05rem;
        }
        .panel-title span {
            color: var(--muted);
            font-size: 0.8rem;
        }
        .chart-wrap {
            height: 260px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        th {
            text-align: left;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .token-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 12px;
        }
        .token-bar input {
            flex: 1;
            padding: 10px 12px;
            background: #0b111a;
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: var(--text);
        }
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.2), rgba(0, 255, 136, 0.2));
            border: 1px solid rgba(0, 217, 255, 0.6);
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }
        .status {
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            background: rgba(0, 255, 136, 0.16);
            color: var(--accent-2);
            font-family: 'JetBrains Mono', monospace;
        }
        .status.error { background: rgba(255, 59, 107, 0.18); color: var(--danger); }

        .span-3 { grid-column: span 3; }
        .span-4 { grid-column: span 4; }
        .span-5 { grid-column: span 5; }
        .span-6 { grid-column: span 6; }
        .span-7 { grid-column: span 7; }
        .span-8 { grid-column: span 8; }
        .span-12 { grid-column: span 12; }

        @media (max-width: 1100px) {
            .span-3, .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
            header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div id="analytics-root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <script type="text/babel">
        const { useEffect, useMemo, useRef, useState } = React;

        const API_BASE = window.ANALYTICS_API_BASE || 'http://localhost:4000';

        const sampleData = {
            summary: {
                total_scans: 1280,
                unique_users: 312,
                returning_users: 198,
                completion_rate: 0.94,
                timeframe: 'last_30_days'
            },
            traffic: {
                interval: 'daily',
                series: [
                    { day: '2026-01-25', total_users: 42, unique_users: 30 },
                    { day: '2026-01-26', total_users: 48, unique_users: 33 },
                    { day: '2026-01-27', total_users: 61, unique_users: 41 },
                    { day: '2026-01-28', total_users: 52, unique_users: 36 },
                    { day: '2026-01-29', total_users: 67, unique_users: 45 },
                    { day: '2026-01-30', total_users: 71, unique_users: 47 },
                    { day: '2026-01-31', total_users: 58, unique_users: 39 }
                ]
            },
            scans: {
                by_status: [
                    { status: 'completed', count: 1180 },
                    { status: 'failed', count: 60 },
                    { status: 'in_progress', count: 40 }
                ],
                by_type: [
                    { type: 'full', count: 730 },
                    { type: 'quick', count: 410 },
                    { type: 'custom', count: 140 }
                ]
            },
            severity: {
                distribution: [
                    { severity: 'low', count: 480 },
                    { severity: 'medium', count: 290 },
                    { severity: 'high', count: 140 },
                    { severity: 'critical', count: 38 }
                ]
            },
            topVulns: {
                items: [
                    { type: 'XSS', count: 122 },
                    { type: 'SQLi', count: 94 },
                    { type: 'Missing CSP', count: 88 },
                    { type: 'Open Redirect', count: 61 },
                    { type: 'Insecure Headers', count: 55 }
                ]
            },
            topDomains: {
                items: [
                    { domain_hash: 'c0f3...9a1', scans: 48 },
                    { domain_hash: '9d12...f4c', scans: 41 },
                    { domain_hash: 'ab77...2dd', scans: 37 },
                    { domain_hash: 'ef01...891', scans: 34 }
                ]
            }
        };

        const ChartCanvas = ({ type, data, options }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                if (chartRef.current) {
                    chartRef.current.destroy();
                }
                chartRef.current = new Chart(canvasRef.current, { type, data, options });
                return () => chartRef.current && chartRef.current.destroy();
            }, [type, data, options]);

            return <canvas ref={canvasRef}></canvas>;
        };

        const App = () => {
            const [filters, setFilters] = useState({
                from: '2026-01-25',
                to: '2026-01-31',
                severity: 'all',
                scanType: 'all'
            });
            const [token, setToken] = useState(localStorage.getItem('admin_token') || '');
            const [data, setData] = useState(sampleData);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const headers = useMemo(() => ({
                'Content-Type': 'application/json',
                ...(token ? { Authorization: `Bearer ${token}` } : {})
            }), [token]);

            const fetchAnalytics = async () => {
                setLoading(true);
                setError(null);
                try {
                    const [summary, traffic, scans, severity, topVulns, topDomains] = await Promise.all([
                        fetch(`${API_BASE}/v1/admin/analytics/summary?from=${filters.from}&to=${filters.to}`, { headers }),
                        fetch(`${API_BASE}/v1/admin/analytics/traffic?interval=daily`, { headers }),
                        fetch(`${API_BASE}/v1/admin/analytics/scans`, { headers }),
                        fetch(`${API_BASE}/v1/admin/analytics/severity`, { headers }),
                        fetch(`${API_BASE}/v1/admin/analytics/top-vuln-types`, { headers }),
                        fetch(`${API_BASE}/v1/admin/analytics/top-domains`, { headers })
                    ]);

                    const payload = {
                        summary: await summary.json(),
                        traffic: await traffic.json(),
                        scans: await scans.json(),
                        severity: await severity.json(),
                        topVulns: await topVulns.json(),
                        topDomains: await topDomains.json()
                    };
                    setData(payload);
                } catch (err) {
                    setData(sampleData);
                    setError('Using sample data. Connect the analytics backend to load live metrics.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchAnalytics();
            }, [filters]);

            const trafficLabels = data.traffic.series.map((item) => item.day);
            const trafficData = {
                labels: trafficLabels,
                datasets: [
                    {
                        label: 'Total Users',
                        data: data.traffic.series.map((item) => item.total_users),
                        borderColor: '#00d9ff',
                        backgroundColor: 'rgba(0, 217, 255, 0.15)',
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Unique Users',
                        data: data.traffic.series.map((item) => item.unique_users),
                        borderColor: '#00ff88',
                        backgroundColor: 'rgba(0, 255, 136, 0.12)',
                        tension: 0.3,
                        fill: true
                    }
                ]
            };

            const scansData = {
                labels: data.scans.by_status.map((item) => item.status),
                datasets: [
                    {
                        label: 'Scans',
                        data: data.scans.by_status.map((item) => item.count),
                        backgroundColor: ['#00ff88', '#ff3b6b', '#ffb800']
                    }
                ]
            };

            const severityData = {
                labels: data.severity.distribution.map((item) => item.severity),
                datasets: [
                    {
                        data: data.severity.distribution.map((item) => item.count),
                        backgroundColor: ['#00ff88', '#00d9ff', '#ffb800', '#ff3b6b']
                    }
                ]
            };

            const vulnData = {
                labels: data.topVulns.items.map((item) => item.type),
                datasets: [
                    {
                        label: 'Findings',
                        data: data.topVulns.items.map((item) => item.count),
                        backgroundColor: 'rgba(0, 217, 255, 0.4)',
                        borderColor: '#00d9ff'
                    }
                ]
            };

            return (
                <div className="shell">
                    <header>
                        <div className="brand">
                            <h1>Checkmate Analytics</h1>
                            <span>PRIVATE • GDPR‑FIRST • ADMIN ONLY</span>
                        </div>
                        <div className="filter-bar">
                            <div className="filter-card">
                                <label>From</label>
                                <input
                                    type="date"
                                    value={filters.from}
                                    onChange={(e) => setFilters({ ...filters, from: e.target.value })}
                                />
                            </div>
                            <div className="filter-card">
                                <label>To</label>
                                <input
                                    type="date"
                                    value={filters.to}
                                    onChange={(e) => setFilters({ ...filters, to: e.target.value })}
                                />
                            </div>
                            <div className="filter-card">
                                <label>Severity</label>
                                <select
                                    value={filters.severity}
                                    onChange={(e) => setFilters({ ...filters, severity: e.target.value })}
                                >
                                    <option value="all">All</option>
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                            <div className="filter-card">
                                <label>Scan Type</label>
                                <select
                                    value={filters.scanType}
                                    onChange={(e) => setFilters({ ...filters, scanType: e.target.value })}
                                >
                                    <option value="all">All</option>
                                    <option value="full">Full</option>
                                    <option value="quick">Quick</option>
                                    <option value="custom">Custom</option>
                                </select>
                            </div>
                        </div>
                    </header>

                    <div className="grid">
                        <div className="panel span-3 kpi">
                            <h3>Total Scans</h3>
                            <strong>{data.summary.total_scans}</strong>
                            <small>Across selected period</small>
                        </div>
                        <div className="panel span-3 kpi">
                            <h3>Unique Users</h3>
                            <strong>{data.summary.unique_users}</strong>
                            <small>Privacy‑hashed identifiers</small>
                        </div>
                        <div className="panel span-3 kpi">
                            <h3>Returning Users</h3>
                            <strong>{data.summary.returning_users}</strong>
                            <small>Based on anonymized IDs</small>
                        </div>
                        <div className="panel span-3 kpi">
                            <h3>Completion Rate</h3>
                            <strong>{Math.round(data.summary.completion_rate * 100)}%</strong>
                            <small>Finished vs started</small>
                        </div>

                        <div className="panel span-8">
                            <div className="panel-title">
                                <h2>Traffic & Engagement</h2>
                                <span>{data.summary.timeframe}</span>
                            </div>
                            <div className="chart-wrap">
                                <ChartCanvas type="line" data={trafficData} options={{ responsive: true, maintainAspectRatio: false }} />
                            </div>
                        </div>

                        <div className="panel span-4">
                            <div className="panel-title">
                                <h2>Scan Status</h2>
                                <span>Completed vs Failed</span>
                            </div>
                            <div className="chart-wrap">
                                <ChartCanvas type="bar" data={scansData} options={{ responsive: true, maintainAspectRatio: false }} />
                            </div>
                        </div>

                        <div className="panel span-4">
                            <div className="panel-title">
                                <h2>Severity Distribution</h2>
                                <span>Aggregated findings</span>
                            </div>
                            <div className="chart-wrap">
                                <ChartCanvas type="doughnut" data={severityData} options={{ responsive: true, maintainAspectRatio: false }} />
                            </div>
                        </div>

                        <div className="panel span-8">
                            <div className="panel-title">
                                <h2>Top Vulnerability Types</h2>
                                <span>Across all scans</span>
                            </div>
                            <div className="chart-wrap">
                                <ChartCanvas
                                    type="bar"
                                    data={vulnData}
                                    options={{
                                        indexAxis: 'y',
                                        responsive: true,
                                        maintainAspectRatio: false,
                                        scales: { x: { beginAtZero: true } }
                                    }}
                                />
                            </div>
                        </div>

                        <div className="panel span-12">
                            <div className="panel-title">
                                <h2>Top Target Domains (Hashed)</h2>
                                <span>PII‑safe output</span>
                            </div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Domain Hash</th>
                                        <th>Scans</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.topDomains.items.map((item) => (
                                        <tr key={item.domain_hash}>
                                            <td>{item.domain_hash}</td>
                                            <td>{item.scans}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="panel" style={{ marginTop: '18px' }}>
                        <div className="panel-title">
                            <h2>Admin Session</h2>
                            <span className={error ? 'status error' : 'status'}>{error || (loading ? 'Loading' : 'Live')}</span>
                        </div>
                        <p style={{ color: 'var(--muted)', margin: '0 0 12px' }}>
                            Store your admin JWT locally to authorize requests. The dashboard does not persist raw PII.
                        </p>
                        <div className="token-bar">
                            <input
                                type="password"
                                placeholder="Paste admin JWT"
                                value={token}
                                onChange={(e) => setToken(e.target.value)}
                            />
                            <button
                                className="btn"
                                onClick={() => {
                                    localStorage.setItem('admin_token', token);
                                    fetchAnalytics();
                                }}
                            >
                                Save & Refresh
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('analytics-root')).render(<App />);
    </script>
</body>
</html>
